{% extends 'base.html' %}
{% block title %}Password Changed{% endblock %}
{% block page_title %}Password Changed{% endblock %}

{% block content %}
<div class="card form-card" style="text-align:center;padding:48px;">
  <div style="font-size:3rem;color:var(--accent);margin-bottom:16px;"><i class="fas fa-check-circle"></i></div>
  <h2>Password Updated Successfully!</h2>
  <p class="text-muted mt-1">Your password has been changed. You can continue using the system.</p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3"><i class="fas fa-home"></i> Go to Dashboard</a>
</div>
{% endblock %}
