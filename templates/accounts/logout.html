{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out | MedVault</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align:center;">
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-sign-out-alt"></i></div>
        <h1>You've been logged out</h1>
        <p>Thank you for using MedVault. Stay healthy!</p>
      </div>
      <a href="{% url 'login' %}" class="btn btn-primary" style="width:100%; justify-content:center;">
        <i class="fas fa-sign-in-alt"></i> Sign In Again
      </a>
    </div>
  </div>
</body>
</html>
