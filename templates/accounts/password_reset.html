{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | MedVault</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-unlock-alt"></i></div>
        <h1>Reset Password</h1>
        <p>Enter your email to receive a password reset link</p>
      </div>
      <form method="post" id="password-reset-form">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" name="email" id="id_email" class="form-control" placeholder="your@email.com" required autofocus>
        </div>
        {% if form.errors %}
        <ul class="form-errors">{% for field in form %}{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}{% endfor %}</ul>
        {% endif %}
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
      </form>
      <div class="auth-links"><p><a href="{% url 'login' %}"><i class="fas fa-arrow-left"></i> Back to Login</a></p></div>
    </div>
  </div>
</body>
</html>
