{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Sent | MedVault</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align:center;">
      <div style="font-size:3rem;color:var(--accent);margin-bottom:16px;"><i class="fas fa-envelope-open-text"></i></div>
      <h1 style="font-size:1.3rem;">Check Your Email</h1>
      <p style="color:var(--text-secondary);margin-top:8px;">If an account exists with the email you entered, we've sent a password reset link.</p>
      <div class="auth-links mt-3"><p><a href="{% url 'login' %}"><i class="fas fa-arrow-left"></i> Back to Login</a></p></div>
    </div>
  </div>
</body>
</html>
