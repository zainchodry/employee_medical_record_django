{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete | MedVault</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align:center;">
      <div style="font-size:3rem;color:var(--accent);margin-bottom:16px;"><i class="fas fa-check-circle"></i></div>
      <h1 style="font-size:1.3rem;">Password Reset Complete!</h1>
      <p style="color:var(--text-secondary);margin-top:8px;">Your password has been set. You may now sign in.</p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-3" style="width:100%;justify-content:center;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </a>
    </div>
  </div>
</body>
</html>
